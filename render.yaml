# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: flame-in-freefall
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false   # optional; paste it in the Render dashboard, never in this file
      - key: ALLOWED_ORIGINS
        value: "*"
