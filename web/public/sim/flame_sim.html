<!-- Flame in Freefall: flame simulator. Timing and outcomes come from the project's NASA-trained models (passed in
     as PARAMS); flame shape follows buoyancy physics; colours and glow are illustrative, not to scale. -->
<div id="wrap" style="font-family:Inter,Arial,sans-serif;color:#14213d">
  <div style="display:flex;gap:14px;flex-wrap:wrap">
    <div class="pane"><div class="hd" id="h0"></div><canvas id="c0" width="460" height="300"></canvas><div class="ft" id="f0"></div></div>
    <div class="pane"><div class="hd" id="h1"></div><canvas id="c1" width="460" height="300"></canvas><div class="ft" id="f1"></div></div>
  </div>
  <div style="margin-top:8px;display:flex;gap:10px;align-items:center">
    <button id="pp">❚❚ Pause</button><button id="rs">↺ Restart</button>
    <span id="clock" style="font-size:13px;color:#52514e"></span>
  </div>
</div>
<style>
 .pane{flex:1;min-width:300px;background:#0b1220;border-radius:12px;padding:10px}
 .hd{color:#e8edf5;font-size:13px;font-weight:600;margin-bottom:6px}
 .ft{color:#aeb9c9;font-size:12px;margin-top:6px;min-height:32px}
 canvas{width:100%;height:auto;border-radius:8px;background:#060b16}
 button{background:#fde7d6;border:0;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
</style>
<script>
const P = JSON.parse(decodeURIComponent(location.hash.slice(1)));
let t0 = performance.now(), paused = false, pauseAt = 0, offset = 0;
document.getElementById('pp').onclick = () => { paused = !paused; if (paused) pauseAt = performance.now(); else offset += performance.now() - pauseAt;
  document.getElementById('pp').textContent = paused ? '▶ Play' : '❚❚ Pause'; };
document.getElementById('rs').onclick = () => { t0 = performance.now(); offset = 0; };
[0,1].forEach(i => { document.getElementById('h'+i).textContent = P.panes[i].title; });

function glow(ctx, x, y, rx, ry, inner, outer, alpha){
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry/rx);
  const g = ctx.createRadialGradient(0, 0, rx*0.05, 0, 0, rx);
  g.addColorStop(0, inner.replace('A', alpha)); g.addColorStop(0.55, outer.replace('A', alpha*0.8)); g.addColorStop(1, outer.replace('A', 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 2*Math.PI); ctx.fill(); ctx.restore();
}
function flame(ctx, cx, cy, size, q, t, alpha){
  // q: up (buoyant stretch 0..1), down (downstream stretch 0..1), soot (0..1), bright (0.6..1.6), flicker (0..1)
  const fl = 1 + q.flicker * 0.08 * Math.sin(t*9) + q.flicker*0.05*Math.sin(t*23);
  const rx = size * (1 + 0.9*q.down), ry = size * (1 + 1.8*q.up) * fl;
  const dx = size * 1.1 * q.down, dy = -size * 1.3 * q.up;
  const b = Math.min(1, 0.55 + 0.35*q.bright);
  glow(ctx, cx+dx, cy+dy, rx*1.35, ry*1.35, 'rgba(70,120,255,A)', 'rgba(40,80,220,A)', 0.55*alpha*b);           // blue edge
  if (q.soot > 0.05) glow(ctx, cx+dx*0.9, cy+dy*1.05, rx*0.95, ry*1.0, 'rgba(255,236,170,A)', 'rgba(255,150,40,A)', q.soot*alpha*b);
  glow(ctx, cx+dx*0.6, cy+dy*0.6, rx*0.5, ry*0.55, 'rgba(255,255,255,A)', 'rgba(255,190,110,A)', 0.35*alpha*b);
}
function frame(now){
  const T = paused ? (pauseAt - t0 - offset)/1000 : (now - t0 - offset)/1000;
  P.panes.forEach((pn, i) => {
    const c = document.getElementById('c'+i), ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    // gravity arrow and airflow arrows
    ctx.fillStyle = '#5b6b84'; ctx.font = '12px Inter, Arial';
    ctx.fillText(pn.gravity_label, 12, 20);
    if (pn.air > 0.4) { ctx.fillText('airflow ' + pn.air.toFixed(1) + ' cm/s →', c.width-150, 20);
      ctx.strokeStyle = 'rgba(120,140,170,0.35)'; ctx.setLineDash([6,8]);
      for (let k=0;k<5;k++){ const yy = 60 + k*48; const sh = (T*pn.air*6) % 14; ctx.beginPath(); ctx.moveTo(-sh,yy); ctx.lineTo(c.width,yy); ctx.stroke(); }
      ctx.setLineDash([]); }
    const cyc = Math.max(...P.panes.map(q => Math.min(q.t_end, 600))) * 1.25 + 3;   // loop the animation
    const tsim = (T * P.speed) % cyc;
    const cx = c.width*0.42, cy = c.height*0.6;
    let alpha = 1, note = '';
    if (P.mode === 'droplet') {
      const d2 = Math.max(pn.d0*pn.d0 - pn.K*tsim, pn.dext*pn.dext);
      const d = Math.sqrt(d2), out = tsim >= pn.t_end;
      const scale = 22;                      // px per mm (droplet drawn to scale against the 1 cm bar)
      alpha = out ? Math.max(0, 1 - (tsim - pn.t_end)/0.6) : 1;
      if (alpha > 0) flame(ctx, cx, cy, d*scale*pn.standoff/2, pn.q, T, alpha);
      ctx.fillStyle = '#dfe6f0'; ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.5, d*scale/2), 0, 2*Math.PI); ctx.fill();
      ctx.fillStyle = '#5b6b84'; ctx.fillRect(16, c.height-18, scale*10, 2); ctx.fillText('1 cm', 16, c.height-24);
      note = out ? `flame out at ${pn.t_end.toFixed(1)} s · droplet left: ${pn.dext.toFixed(2)} mm` :
                   `t = ${tsim.toFixed(1)} s · droplet ${d.toFixed(2)} mm · K = ${pn.K.toFixed(2)} mm²/s`;
    } else if (P.mode === 'gas') {
      const out = pn.t_end < 900 && tsim >= pn.t_end;
      alpha = out ? Math.max(0, 1 - (tsim - pn.t_end)/1.0) : 1;
      if (alpha > 0) flame(ctx, cx, cy, 34*pn.size, pn.q, T, alpha);
      ctx.fillStyle = '#8a94a6'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 2*Math.PI); ctx.fill();
      ctx.fillRect(cx-2, cy+9, 4, 60);
      note = out ? `went out by itself at about ${pn.t_end.toFixed(0)} s (model median)` :
                   `t = ${tsim.toFixed(0)} s · median self-extinction ${pn.t_end < 900 ? pn.t_end.toFixed(0)+' s' : 'beyond 15 min'}`;
    } else {
      const L = c.width*0.8, x0 = c.width*0.1, y0 = cy;
      const burnLen = Math.min(L, pn.spread * tsim * 4);
      const keep = pn.p_burn >= 0.5;
      const fade = keep ? 1 : Math.max(0, 1 - tsim/6);
      const shown = keep ? burnLen : Math.min(burnLen, L*0.12);
      const opposed = pn.direction === 'opposed';           // opposed flow: the flame creeps upstream, into the air
      ctx.fillStyle = '#3a4456'; ctx.fillRect(x0, y0-4, L, 8);
      ctx.fillStyle = '#1c2230'; ctx.fillRect(opposed ? x0 + L - shown : x0, y0-4, shown, 8);
      const fx = opposed ? x0 + L - shown : x0 + shown;
      if (fade > 0) flame(ctx, fx, y0-4, 26, pn.q, T, fade);
      note = keep ? `${(pn.p_burn*100).toFixed(0)} % chance it keeps burning: the flame keeps spreading` :
                    `${(pn.p_burn*100).toFixed(0)} % chance it keeps burning: the flame most likely goes out`;
    }
    document.getElementById('f'+i).textContent = note + (pn.extra ? ' · ' + pn.extra : '');
  });
  document.getElementById('clock').textContent = `simulated time runs ${P.speed}× faster than real time`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
